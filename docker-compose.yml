# NotificationHub – Development Docker Compose
# Usage: docker compose up

name: notificationhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: notificationhub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/notificationhub.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - APP_SECRET=${APP_SECRET:-change-me-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - notificationhub_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.notificationhub.description=NotificationHub notification routing engine"

volumes:
  notificationhub_data:
    driver: local
